<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Touring</title>
    <style>
      :root {
        /* synthwave: indigo night, hot pink, cyan, a little sunset orange */
        --ink: #0d0221; --panel: rgba(18, 6, 40, .82); --line: rgba(255, 45, 149, .45);
        --pink: #ff2d95; --cyan: #2de2e6; --violet: #9d4dff; --sun: #ffb347;
        --text: #efe6ff; --dim: #9a8cc2;
        --font: 'Avenir Next', 'Avenir', 'Century Gothic', 'Futura', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      }
      html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; font-family: var(--font);
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* prompts come in keyboard and gamepad flavours; body.pad = a gamepad was used last */
      body.pad .kb, body:not(.pad) .gp { display: none !important; }
      canvas { display: block; }

      #hud { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); max-width: calc(100% - 28px);
        color: var(--text); font-size: 12px; font-weight: 300; letter-spacing: .08em; line-height: 1.7; opacity: .9;
        text-shadow: 0 1px 3px #000, 0 0 12px rgba(157, 77, 255, .5); }
      #hud b { color: var(--cyan); font-weight: 600; }

      /* title card: thin, wide-set capitals with a neon glow; a sunset rule under it */
      #callout { position: fixed; left: 0; right: 0; top: 16%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .15s;
        font: 200 clamp(34px, 8vw, 96px)/1.05 var(--font); letter-spacing: .42em; text-indent: .42em; text-transform: uppercase; color: #fff;
        text-shadow: 0 0 .06em #fff, -.035em 0 0 rgba(45, 226, 230, .75), .035em 0 0 rgba(255, 45, 149, .75),
          0 0 .35em rgba(255, 45, 149, .75), 0 0 1em rgba(157, 77, 255, .6); }
      #callout::after { content: ''; display: block; width: min(420px, 60vw); height: 2px; margin: .3em auto 0;
        background: linear-gradient(90deg, transparent, var(--sun), var(--pink), var(--violet), transparent); box-shadow: 0 0 12px var(--pink); }
      #callout small { display: block; margin-top: 1.1em; font-size: .2em; font-weight: 400; letter-spacing: .5em; text-indent: .5em; color: var(--cyan);
        text-shadow: 0 0 .7em rgba(45, 226, 230, .8), 0 1px 3px #000; }

      #menubtn { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); z-index: 20;
        width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: rgba(18, 6, 40, .5);
        color: var(--text); font: 300 18px/1 var(--font); cursor: pointer; opacity: .6; transition: opacity .2s, border-color .2s; }
      #menubtn:hover { opacity: 1; border-color: var(--pink); }

      /* options menu (course/menu.js) */
      #menu { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
        background: radial-gradient(ellipse at center, rgba(13, 2, 33, .35), rgba(13, 2, 33, .8)); color: var(--text); }
      #menu.open { display: flex; }
      #menu .panel { width: min(480px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 22px 26px 18px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px);
        box-shadow: 0 0 0 1px rgba(45, 226, 230, .15), 0 0 40px rgba(157, 77, 255, .35), inset 0 0 30px rgba(255, 45, 149, .06); }
      #menu h2 { margin: 0 0 14px; font: 200 22px/1 var(--font); letter-spacing: .5em; text-indent: .5em; text-align: center; color: #fff;
        text-shadow: 0 0 .5em var(--pink); }
      #menu ul.rows { list-style: none; margin: 0; padding: 0; }
      #menu .rows li { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 2px 0; padding: 9px 12px; border-radius: 6px;
        border: 1px solid transparent; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); cursor: pointer; }
      #menu .rows li.sel { color: #fff; border-color: var(--pink); background: rgba(255, 45, 149, .1); box-shadow: 0 0 14px rgba(255, 45, 149, .3); }
      #menu .rows li .v { color: var(--cyan); text-align: right; letter-spacing: .06em; text-transform: none; font-size: 14px; }
      #menu .rows li .v.slider { display: flex; align-items: center; gap: 10px; }
      #menu .rows li .v.slider b { font-weight: 400; min-width: 3.2em; text-align: right; }
      #menu .rows li .v.slider input { width: 130px; accent-color: var(--cyan); cursor: pointer; }
      #menu .rows li .v i { font-style: normal; color: var(--dim); }
      #menu .rows li.sel .v i { color: var(--pink); }
      #menu .drop { position: fixed; z-index: 40; overflow-y: auto; padding: 4px; box-sizing: border-box; border: 1px solid var(--pink); border-radius: 6px;
        background: rgba(8, 4, 24, .97); box-shadow: 0 8px 30px rgba(0, 0, 0, .6), 0 0 16px rgba(255, 45, 149, .3); }
      #menu .drop .opt { padding: 6px 10px; border-radius: 4px; color: var(--text); font-size: 14px; letter-spacing: .06em; text-transform: none; text-align: right; cursor: pointer; }
      #menu .drop .opt.cur { color: var(--cyan); }
      #menu .drop .opt.hot, #menu .drop .opt:hover { background: rgba(255, 45, 149, .22); color: #fff; }
      #menu .rows li .v.changed { color: var(--sun); }
      #menu .rows li.kind-credits, #menu .rows li.kind-apply, #menu .rows li.kind-resume { justify-content: center; }
      #menu .rows li.kind-apply { color: var(--sun); }
      #menu .rows li.kind-resume { margin-top: 8px; }
      #menu .hint { margin-top: 12px; text-align: center; font-size: 11px; letter-spacing: .1em; color: var(--dim); }
      #menu .credits { display: none; margin-top: 10px; max-height: 50vh; overflow-y: auto; font-size: 12px; line-height: 1.55; color: var(--dim);
        padding: 4px 8px; border-top: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--violet) transparent; user-select: text; }
      #menu.credits-open .rows { display: none; }
      #menu.credits-open .credits { display: block; }
      #menu .credits h3 { margin: 14px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--text); }
      #menu .credits p, #menu .credits ul { list-style: disc; margin: 4px 0; }
      #menu .credits ul { padding-left: 18px; }
      @media (max-height: 640px) { #menu .panel { padding: 14px 22px 12px; } #menu h2 { margin-bottom: 8px; } #menu .rows li { padding: 6px 12px; } #menu .rows li.kind-resume { margin-top: 2px; } }
      #menu .credits a { color: var(--cyan); overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="callout"></div>
    <button id="menubtn" title="Options (Esc)" aria-label="Options">☰</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
