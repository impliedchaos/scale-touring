# Build the fly-by and publish web/dist/ to GitHub Pages.
# One-off setup in the repo: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Runs on every push to main (and by hand from the Actions tab). The build uses relative asset paths (vite base './'),
# so it works from the repo's sub-path (https://<user>.github.io/<repo>/) with no extra config; ?site=hk etc. work as usual.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces a running one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .glb, .bin and .npy are in Git LFS. The site only needs web/public (~27 MB); skipping assets/ and data/ keeps
      # each run well inside the free LFS bandwidth quota (1 GB a month).
      - run: git lfs pull --include="web/public/**,assets/songs/**"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5   # `prebuild` runs tools/build_music.py (a no-op while there are no songs)
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
